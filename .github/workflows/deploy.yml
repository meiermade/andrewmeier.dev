name: Deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

concurrency:
  group: andymeier-deploy
  cancel-in-progress: false

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Install Packages
        working-directory: ./pulumi
        run: npm ci
      - name: TypeScript Check
        working-directory: ./pulumi
        run: npm run check
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
      - name: Expose GitHub Actions cache env
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])
      - name: Authenticate Pulumi
        uses: pulumi/auth-actions@v2
        with:
          organization: meiermade
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:meiermade
      - name: Update
        uses: pulumi/actions@v7
        with:
          work-dir: ./pulumi
          command: up
          stack-name: prod

  e2e:
    name: E2E
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Restore build automation
        working-directory: ./app
        run: |
          dotnet tool restore
          dotnet paket restore
          dotnet restore src/Build/Build.fsproj
      - name: Verify published regional analytics
        working-directory: ./app
        env:
          SITE_E2E_BASE_URL: https://andymeier.dev
        run: ./fake.sh VerifyPublishedAnalytics --single-target
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: andymeier-deploy-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
